[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2pdf-skill"
version = "0.1.0"
description = "High-fidelity DOC and DOCX to PDF conversion with optimization and deterministic QA."
requires-python = ">=3.10,<3.14"
dependencies = [
  "lxml>=5,<7",
  "pikepdf>=9,<11",
  "pillow>=11,<13",
  "pymupdf>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "python-docx>=1.2,<2", "reportlab>=4.2,<5"]

[project.scripts]
doc2pdf = "doc2pdf_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: runs LibreOffice and Ghostscript conversion"]
