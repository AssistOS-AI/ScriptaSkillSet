[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shortdescription-skill"
version = "0.1.0"
description = "Solution-withholding thematic descriptions from semantic HTML using the active LLM."
requires-python = ">=3.10,<3.14"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
shortdescription = "shortdescription_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
