[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2html-skill"
version = "0.1.0"
description = "Local, semantic PDF-to-HTML conversion with deterministic validation."
requires-python = ">=3.10,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "docling>=2.66,<3",
  "pdfplumber>=0.11,<1",
  "pillow>=11,<13",
  "playwright>=1.50,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "reportlab>=4.2,<5",
]

[project.scripts]
pdf2html = "pdf2html_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: runs the full Docling and browser conversion pipeline"]
