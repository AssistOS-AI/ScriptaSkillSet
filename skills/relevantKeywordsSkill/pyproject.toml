[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relevantkeywords-skill"
version = "0.1.0"
description = "Multilingual fundamental keyword extraction for semantic HTML books."
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "numpy>=1.26,<3",
  "onnxruntime>=1.22,<2",
  "regex>=2024.11.6",
  "sentencepiece>=0.2,<1",
  "simplemma>=2,<3",
  "stopwordsiso>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
relevantkeywords = "relevantkeywords_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
