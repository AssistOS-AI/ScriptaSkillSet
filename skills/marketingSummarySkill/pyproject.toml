[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketingsummary-skill"
version = "0.1.0"
description = "Spoiler-safe editorial marketing pages from semantic HTML using the active LLM."
requires-python = ">=3.10,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "langcodes>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
marketingsummary = "marketingsummary_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
