[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "html2doc-skill"
version = "0.1.0"
description = "Convert Scripta semantic HTML books to editable, professionally styled DOCX files."
requires-python = ">=3.10,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "cssselect2>=0.7,<1",
  "lxml>=5,<7",
  "pillow>=11,<13",
  "python-docx>=1.2,<2",
  "tinycss2>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
html2doc = "html2doc_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
