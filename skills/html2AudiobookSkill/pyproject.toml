[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "html2audiobook-skill"
version = "0.1.0"
description = "Local HTML book narration through ebook2audiobook and Piper"
requires-python = ">=3.10,<3.14"
dependencies = ["beautifulsoup4>=4.12,<5", "langdetect>=1.0.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
html2audiobook = "html2audiobook_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
