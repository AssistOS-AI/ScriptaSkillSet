[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comprehensivesummary-skill"
version = "0.1.0"
description = "Chapter-aware, source-traceable summaries of semantic HTML books with the active LLM."
requires-python = ">=3.10,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "langcodes>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
comprehensivesummary = "comprehensivesummary_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
